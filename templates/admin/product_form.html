{% extends "base.html" %}{% block content %}<section class="admin-wrap narrow"><div class="admin-head"><div><p class="eyebrow">CATALOGUE</p><h1>{{ 'Edit' if product.id else 'Add' }} <em>product.</em></h1></div><a href="{{ url_for('admin_products') }}">← Back</a></div><form class="product-admin-form" method="post"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>Product name<input name="name" value="{{ product.name or '' }}" required></label><div class="two-fields"><label>Brand<input name="brand" value="{{ product.brand or '' }}" required></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label></div><label>Description<textarea name="description" rows="5" required>{{ product.description or '' }}</textarea></label><div class="three-fields"><label>Price<input type="number" step="0.01" name="price" value="{{ product.price or '' }}" required></label><label>Sale price<input type="number" step="0.01" name="discount_price" value="{{ product.discount_price or '' }}"></label><label>Stock<input type="number" name="stock" value="{{ product.stock or 0 }}" required></label></div><label>Image URL<input name="image" value="{{ product.image or '' }}" placeholder="https://…"></label><button class="button dark">Save product ↗</button></form></section>{% endblock %}
