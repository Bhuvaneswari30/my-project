{% extends "base.html" %}{% block content %}<section class="admin-wrap"><div class="admin-head"><div><p class="eyebrow">CUSTOMERS</p><h1>Manage <em>users.</em></h1></div></div><nav class="admin-nav"><a href="{{ url_for('admin_dashboard') }}">Overview</a><a href="{{ url_for('admin_products') }}">Products</a><a href="{{ url_for('admin_orders') }}">Orders</a><a class="active" href="{{ url_for('admin_users') }}">Users</a><a href="{{ url_for('admin_reviews') }}">Reviews</a></nav><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody>{% for user in users %}<tr><td><strong>{{ user.name }}</strong></td><td>{{ user.email }}</td><td><span class="status">{{ user.role }}</span></td><td>{{ user.created_at.strftime('%d %b %Y') }}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
